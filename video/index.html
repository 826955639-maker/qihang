<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会飞的车去跳岛</title>
<style>
  @font-face { font-family: KuaiLe; src: url(assets/ZCOOLKuaiLe.ttf) format('truetype'); font-display: block; }
  :root { --bg: #f3ead3; --ink: #2b2b3a; --panel: #fffdf5; --accent: #ff7a59; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1d26; --ink: #f1ead6; --panel: #2a2a36; } }
  :root[data-theme="dark"] { --bg: #1d1d26; --ink: #f1ead6; --panel: #2a2a36; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: KuaiLe, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .player { width: min(100%, 1280px, calc((100vh - 110px) * 16 / 9)); }
  .screen { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; border: 3px solid var(--ink); background: #fdf6e3; }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: rgba(253, 246, 227, 0.55); cursor: pointer; transition: opacity .3s; color: #2b2b3a; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  #overlay .big { width: 110px; height: 110px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 46px;
    display: flex; align-items: center; justify-content: center; border: 4px solid #2b2b3a; box-shadow: 5px 6px 0 rgba(0,0,0,.2); padding-left: 8px; }
  #overlay .hint { font-size: 22px; background: #fffdf5; padding: 6px 18px; border-radius: 20px; border: 2.5px solid #2b2b3a; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 12px; background: var(--panel); border: 2.5px solid var(--ink);
    border-radius: 14px; padding: 8px 12px; }
  .bar button { font: inherit; font-size: 18px; min-width: 44px; height: 40px; border-radius: 10px; border: 2px solid var(--ink);
    background: var(--accent); color: #fff; cursor: pointer; }
  .bar button.off { background: transparent; color: var(--ink); opacity: .6; }
  #seek { flex: 1; min-width: 0; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; font-size: 16px; white-space: nowrap; }
</style>
</head>
<body>
<div class="player">
  <div class="screen">
    <canvas id="stage"></canvas>
    <div id="overlay"><div class="big">▶</div><div class="hint">点击播放 · 约 3 分钟 · 请打开声音</div></div>
  </div>
  <div class="bar">
    <button id="play" aria-label="播放/暂停">▶</button>
    <input id="seek" type="range" min="0" step="0.01" value="0" aria-label="进度">
    <span id="time">0:00</span>
    <button id="subs" aria-label="字幕开关">字幕</button>
  </div>
</div>
<audio id="audio" src="assets/soundtrack.mp3" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="js/draw.js"></script>
<script src="js/world.js"></script>
<script src="js/scenes.js"></script>
<script src="js/player.js"></script>
</body>
</html>
