<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>起航附中 · 管理端</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .adminnav { display:flex; gap:6px; overflow-x:auto; padding:10px 16px; background:#fff; border-bottom:1px solid var(--border); position:sticky; top:52px; z-index:15; }
    .adminnav button { white-space:nowrap; border:none; background:#eef2ff; color:var(--brand); padding:8px 14px; border-radius:20px; font-size:14px; }
    .adminnav button.active { background:var(--brand); color:#fff; font-weight:600; }
    .app { padding-bottom:24px; max-width:1100px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div><h1>🚀 起航附中 · 管理端</h1><div class="sub" id="todayLbl"></div></div>
      <button id="logout">退出</button>
    </div>
    <div class="adminnav" id="nav">
      <button data-tab="dashboard" class="active">📊 看板</button>
      <button data-tab="courses">📅 排课</button>
      <button data-tab="students">👨‍🎓 学生</button>
      <button data-tab="teachers">👩‍🏫 教师</button>
      <button data-tab="finance">💰 财务</button>
      <button data-tab="logs">📝 日志</button>
      <button data-tab="settings">⚙️ 设置</button>
    </div>
    <div class="content" id="view"></div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
